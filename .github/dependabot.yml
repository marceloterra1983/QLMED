version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      production-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Manual review for major Next.js / Prisma / React upgrades
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # @types/node acompanha o runtime, nao o ultimo release: Dockerfile e
      # ci.yml rodam node:22, entao um bump para 26.x tipa contra APIs que
      # nao existem em producao.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript 7.x nao tem parser de lint: @typescript-eslint mais recente
      # (8.66.0) declara peer `typescript: >=4.8.4 <6.1.0` e nao existe 9.x.
      # Reavaliar quando typescript-eslint publicar suporte a TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
