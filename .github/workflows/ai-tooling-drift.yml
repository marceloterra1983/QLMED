name: AI tooling drift

on:
  schedule:
    - cron: '15 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: drift
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - pb-linux
      - pb-x64
      - pb-docs
      - pb-python
      - pb-shell
      - pb-powershell
      - pb-dotnet
      - pb-node
      - pb-validation
      - pb-build
      - pb-persistent
    timeout-minutes: 15
    env:
      # O fetch nativo do Node ignora HTTPS_PROXY; sem isto o runner só vê EAI_AGAIN.
      NODE_USE_ENV_PROXY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify AI tooling contract
        run: npm run ai-tooling:check

      - name: Report pin and CLI drift
        run: node ./scripts/check-ai-tooling.mjs --drift --open-issue
