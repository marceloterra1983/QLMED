name: AI tooling drift

on:
  schedule:
    - cron: '15 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify AI tooling contract
        run: npm run ai-tooling:check

      - name: Report pin and CLI drift
        run: node ./scripts/check-ai-tooling.mjs --drift --open-issue
