name: QLMED Production Deploy

on:
  workflow_run:
    workflows: ["QLMED CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qlmed-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 45
    environment:
      name: production
      url: https://app.qlmed.com.br
    runs-on:
      - self-hosted
      - qlmed-prod

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Refuse stale or untrusted revision
        run: |
          expected_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$expected_sha" != "$current_main" ]; then
            echo "Refusing deploy: validated SHA $expected_sha is not current main $current_main" >&2
            exit 1
          fi

      - name: Validate production compose
        run: |
          mkdir -p production/env
          for env_file in \
            app.env \
            n8n.env \
            n8n-legacy.env \
            n8n-restored.env \
            n8n-automation.env \
            n8n-db.env
          do
            : > "production/env/${env_file}"
          done
          : > production/.deploy-meta.env
          docker compose --env-file production/.env.example -f production/docker-compose.yml config >/dev/null

      - name: Sync production manifests
        run: |
          mkdir -p /home/marce/qlmed/production
          cp production/docker-compose.yml /home/marce/qlmed/production/docker-compose.yml

      - name: Sync application source
        run: |
          mkdir -p /home/marce/qlmed/production/app
          rsync -rl --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.next' \
            --exclude 'node_modules' \
            --exclude 'production' \
            ./ /home/marce/qlmed/production/app/

      - name: Stamp deploy metadata
        run: |
          deploy_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          cat > /home/marce/qlmed/production/.deploy-meta.env <<EOF
          QLMED_BUILD_COMMIT_SHA=${deploy_sha}
          QLMED_BUILD_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          QLMED_BUILD_SOURCE=github-actions
          EOF

      - name: Capture rollback image
        run: |
          if docker inspect qlmed-app >/dev/null 2>&1; then
            current_image="$(docker inspect qlmed-app --format '{{.Image}}')"
            docker tag "$current_image" "qlmed-app:rollback-${GITHUB_RUN_ID}"
            # Tag estável para rollback MANUAL pós-deploy (a tag por run é
            # consumida só pelo passo de rollback automático desta execução).
            docker tag "$current_image" "qlmed-app:previous"
            echo "ROLLBACK_IMAGE_AVAILABLE=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy stack on server
        run: |
          set -a
          . /home/marce/qlmed/production/.deploy-meta.env
          set +a
          compose=(docker compose \
            --project-name qlmed \
            --env-file /home/marce/qlmed/production/.env \
            -f /home/marce/qlmed/production/docker-compose.yml)
          "${compose[@]}" build qlmed-app
          rollback_image="qlmed-app:rollback-${GITHUB_RUN_ID}"
          rollback_available="${ROLLBACK_IMAGE_AVAILABLE:-0}"
          if [[ "$rollback_available" == "1" ]]; then
            docker image inspect "$rollback_image" >/dev/null
          fi
          restore_previous() {
            if [[ "$rollback_available" == "1" ]]; then
              QLMED_BUILD_COMMIT_SHA="rollback-${GITHUB_RUN_ID}" \
                "${compose[@]}" up -d --no-build --force-recreate qlmed-app
            fi
          }
          trap restore_previous ERR
          "${compose[@]}" stop qlmed-app
          "${compose[@]}" run --rm --no-deps qlmed-app sh -c '
            set -eu
            state=/tmp/qlmed-production-migration-window.json
            node scripts/verify-production-migration-window.cjs before "$state"
            node node_modules/prisma/build/index.js migrate deploy
            node node_modules/prisma/build/index.js migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
            node scripts/verify-production-migration-window.cjs after "$state"
          '
          "${compose[@]}" up -d --no-build qlmed-app
          trap - ERR

      - name: Verify local health
        run: |
          for url in \
            http://127.0.0.1:13000/api/health
          do
            for attempt in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Health check failed for $url" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Verify deployed revision
        run: |
          expected_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          for url in \
            http://127.0.0.1:13000/api/health \
            https://app.qlmed.com.br/api/health
          do
            for attempt in $(seq 1 30); do
              body="$(curl -fsS "$url" || true)"
              actual_sha="$(printf '%s' "$body" | sed -n 's/.*"commitSha":"\([^"]*\)".*/\1/p')"
              if [ -n "$actual_sha" ] && [[ "$actual_sha" = "$expected_sha"* || "$expected_sha" = "$actual_sha"* ]]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Revision check failed for $url: expected $expected_sha, got ${actual_sha:-missing}" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Verify public endpoints
        run: |
          for url in \
            https://app.qlmed.com.br/
          do
            for attempt in $(seq 1 30); do
              if curl -fsSI "$url" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Public check failed for $url" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Install transactional notification worker
        run: |
          # Installer é cópia root-owned FORA da árvore sincronizada pelo rsync
          # do deploy (auditoria 2026-07-21) — evita escalada gh-runner→marce
          # via script que o próprio deploy poderia sobrescrever. Atualizar via:
          #   sudo install -o root -g root -m 755 <fonte> /usr/local/lib/qlmed/
          sudo -n -u marce -- \
            /usr/bin/bash /usr/local/lib/qlmed/install-notification-outbox-cron.sh \
            /home/marce/qlmed/production/app/scripts/notification-outbox-worker.py

      - name: Preserve and verify manual rollback tag
        if: ${{ success() && env.ROLLBACK_IMAGE_AVAILABLE == '1' }}
        run: |
          # Recria a tag manual a partir da referência protegida por run. Assim,
          # mesmo que um prune remova qlmed-app:previous durante o deploy, ainda
          # preservamos a imagem anterior antes de descartar a referência segura.
          rollback_image="qlmed-app:rollback-${GITHUB_RUN_ID}"
          docker image inspect "$rollback_image" >/dev/null
          docker tag "$rollback_image" qlmed-app:previous
          docker image inspect qlmed-app:previous >/dev/null \
            || { echo "::error::qlmed-app:previous ausente após deploy — rollback manual quebrado"; exit 1; }
          echo "qlmed-app:previous OK"

      - name: Verify first-deploy rollback state
        if: ${{ success() && env.ROLLBACK_IMAGE_AVAILABLE != '1' }}
        run: |
          echo "Primeiro deploy sem container prévio — nada a verificar"

      - name: Clean run-scoped rollback tag
        if: ${{ success() && env.ROLLBACK_IMAGE_AVAILABLE == '1' }}
        run: |
          # Só remove a referência segura depois de confirmar a tag manual. Se a
          # verificação falhar, o passo de rollback ainda encontra esta imagem.
          docker rmi "qlmed-app:rollback-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

      - name: Roll back failed deployment
        if: ${{ failure() && env.ROLLBACK_IMAGE_AVAILABLE == '1' }}
        run: |
          # Este rollback reverte apenas a imagem do qlmed-app; não desfaz migração
          # de banco que já tenha sido aplicada. A imagem anterior deve permanecer
          # compatível com o schema expandido conforme docs/architecture/data.md.
          QLMED_BUILD_COMMIT_SHA="rollback-${GITHUB_RUN_ID}" docker compose \
            --project-name qlmed \
            --env-file /home/marce/qlmed/production/.env \
            -f /home/marce/qlmed/production/docker-compose.yml \
            up -d --no-build --force-recreate qlmed-app
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Rollback health check failed" >&2
          exit 1
