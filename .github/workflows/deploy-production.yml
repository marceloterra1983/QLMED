name: QLMED Production Deploy

# Manual, fail-closed production deploy.
# Requires workflow_dispatch on refs/heads/main with:
#   - confirm_production exactly DEPLOY
#   - revision = full origin/main SHA at fetch time
#   - a completed successful QLMED CI (ci.yml) push run for that exact SHA
# Does NOT run automatically after CI on main.
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type exactly DEPLOY to authorize production mutation'
        required: true
        type: string
      revision:
        description: 'Full 40-character lowercase hex SHA of origin/main to deploy'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qlmed-production
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 45
    environment:
      name: production
      url: https://app.qlmed.com.br
    runs-on:
      - self-hosted
      - qlmed-prod

    steps:
      - name: Fail closed — require explicit DEPLOY confirmation
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM_PRODUCTION}" != "DEPLOY" ]; then
            echo "Refusing deploy: confirm_production must be exactly DEPLOY" >&2
            exit 1
          fi

      - name: Fail closed — require dispatch on main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "Refusing deploy: workflow must run on refs/heads/main (got ${WORKFLOW_REF})" >&2
            exit 1
          fi

      - name: Fail closed — require full lowercase SHA input
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${REQUESTED_REVISION}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refusing deploy: revision must be exactly 40 lowercase hex characters" >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Fail closed — revision must match origin/main then detach
        id: pin-revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "${REQUESTED_REVISION}" != "${current_main}" ]; then
            echo "Refusing deploy: revision ${REQUESTED_REVISION} is not current origin/main ${current_main}" >&2
            exit 1
          fi
          git checkout --detach "${REQUESTED_REVISION}"
          echo "expected_sha=${REQUESTED_REVISION}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_SHA=${REQUESTED_REVISION}" >> "$GITHUB_ENV"

      - name: Fail closed — require successful QLMED CI for this SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ steps.pin-revision.outputs.expected_sha }}
        with:
          script: |
            const expectedSha = process.env.EXPECTED_SHA;
            if (!expectedSha || !/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed(`Internal error: EXPECTED_SHA is not a full lowercase SHA (${expectedSha})`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedFullName = `${owner}/${repo}`;

            // Single-page query for completed push runs of ci.yml matching head_sha.
            // Do not wait/poll: if CI is missing or not successful, fail immediately.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              event: 'push',
              branch: 'main',
              status: 'completed',
              head_sha: expectedSha,
              per_page: 20,
            });

            const match = (data.workflow_runs || []).find((run) => {
              const headRepo = run.head_repository?.full_name || run.repository?.full_name;
              return (
                run.head_sha === expectedSha &&
                run.event === 'push' &&
                run.head_branch === 'main' &&
                run.status === 'completed' &&
                run.conclusion === 'success' &&
                run.path === '.github/workflows/ci.yml' &&
                headRepo === expectedFullName
              );
            });

            if (!match) {
              core.setFailed(
                `Refusing deploy: no completed successful QLMED CI (ci.yml) push run on main for SHA ${expectedSha}. ` +
                  'Wait for CI on that exact SHA, then re-dispatch. PR runs or other SHAs/branches are not accepted.'
              );
              return;
            }

            core.info(`CI gate OK: run id=${match.id} head_sha=${match.head_sha} conclusion=${match.conclusion} url=${match.html_url}`);

      - name: Validate production compose
        run: |
          mkdir -p production/env
          for env_file in \
            app.env \
            n8n.env \
            n8n-legacy.env \
            n8n-restored.env \
            n8n-automation.env \
            n8n-db.env
          do
            : > "production/env/${env_file}"
          done
          : > production/.deploy-meta.env
          docker compose --env-file production/.env.example -f production/docker-compose.yml config >/dev/null

      - name: Fail closed — re-check origin/main before mutation
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA:-}" ]; then
            echo "Refusing deploy: EXPECTED_SHA is empty" >&2
            exit 1
          fi
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "${EXPECTED_SHA}" != "${current_main}" ]; then
            echo "Refusing deploy: origin/main advanced to ${current_main}; expected ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Sync production manifests
        run: |
          mkdir -p /home/marce/qlmed/production
          cp production/docker-compose.yml /home/marce/qlmed/production/docker-compose.yml

      - name: Sync application source
        run: |
          mkdir -p /home/marce/qlmed/production/app
          rsync -rl --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.next' \
            --exclude 'node_modules' \
            --exclude 'production' \
            ./ /home/marce/qlmed/production/app/

      - name: Stamp deploy metadata
        run: |
          deploy_sha="${EXPECTED_SHA}"
          cat > /home/marce/qlmed/production/.deploy-meta.env <<EOF
          QLMED_BUILD_COMMIT_SHA=${deploy_sha}
          QLMED_BUILD_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          QLMED_BUILD_SOURCE=github-actions
          EOF

      - name: Capture rollback image
        run: |
          if docker inspect qlmed-app >/dev/null 2>&1; then
            current_image="$(docker inspect qlmed-app --format '{{.Image}}')"
            docker tag "$current_image" "qlmed-app:rollback-${GITHUB_RUN_ID}"
            # Tag estável para rollback MANUAL pós-deploy (a tag por run é
            # consumida só pelo passo de rollback automático desta execução).
            docker tag "$current_image" "qlmed-app:previous"
            echo "ROLLBACK_IMAGE_AVAILABLE=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy stack on server
        run: |
          set -a
          . /home/marce/qlmed/production/.deploy-meta.env
          set +a
          compose=(docker compose \
            --project-name qlmed \
            --env-file /home/marce/qlmed/production/.env \
            -f /home/marce/qlmed/production/docker-compose.yml)
          "${compose[@]}" build qlmed-app
          rollback_image="qlmed-app:rollback-${GITHUB_RUN_ID}"
          rollback_available="${ROLLBACK_IMAGE_AVAILABLE:-0}"
          if [[ "$rollback_available" == "1" ]]; then
            docker image inspect "$rollback_image" >/dev/null
          fi
          restore_previous() {
            if [[ "$rollback_available" == "1" ]]; then
              QLMED_BUILD_COMMIT_SHA="rollback-${GITHUB_RUN_ID}" \
                "${compose[@]}" up -d --no-build --force-recreate qlmed-app
            fi
          }
          trap restore_previous ERR
          "${compose[@]}" stop qlmed-app
          "${compose[@]}" run --rm --no-deps qlmed-app sh -c '
            set -eu
            state=/tmp/qlmed-production-migration-window.json
            node scripts/verify-production-migration-window.cjs before "$state"
            node node_modules/prisma/build/index.js migrate deploy
            node node_modules/prisma/build/index.js migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
            node scripts/verify-production-migration-window.cjs after "$state"
          '
          "${compose[@]}" up -d --no-build qlmed-app
          trap - ERR

      - name: Verify local health
        run: |
          for url in \
            http://127.0.0.1:13000/api/health
          do
            for attempt in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Health check failed for $url" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Verify deployed revision
        run: |
          expected_sha="${EXPECTED_SHA}"
          for url in \
            http://127.0.0.1:13000/api/health \
            https://app.qlmed.com.br/api/health
          do
            for attempt in $(seq 1 30); do
              body="$(curl -fsS "$url" || true)"
              actual_sha="$(printf '%s' "$body" | sed -n 's/.*"commitSha":"\([^"]*\)".*/\1/p')"
              if [ -n "$actual_sha" ] && [[ "$actual_sha" = "$expected_sha"* || "$expected_sha" = "$actual_sha"* ]]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Revision check failed for $url: expected $expected_sha, got ${actual_sha:-missing}" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Verify public endpoints
        id: app_verified
        run: |
          for url in \
            https://app.qlmed.com.br/
          do
            for attempt in $(seq 1 30); do
              if curl -fsSI "$url" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Public check failed for $url" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Install transactional notification worker
        run: |
          # Installer é cópia root-owned FORA da árvore sincronizada pelo rsync
          # do deploy (auditoria 2026-07-21) — evita escalada gh-runner→marce
          # via script que o próprio deploy poderia sobrescrever. Atualizar via:
          #   sudo install -o root -g root -m 755 <fonte> /usr/local/lib/qlmed/
          # Smoke 401 intermitente logo após o up não deve derrubar o app:
          # o hook é independente do container já verificado.
          for attempt in 1 2 3 4 5; do
            if sudo -n -u marce -- \
              /usr/bin/bash /usr/local/lib/qlmed/install-notification-outbox-cron.sh \
              /home/marce/qlmed/production/app/scripts/notification-outbox-worker.py
            then
              exit 0
            fi
            echo "Worker install attempt ${attempt} failed; retrying in 5s" >&2
            sleep 5
          done
          exit 1

      - name: Preserve and verify manual rollback tag
        if: ${{ success() && env.ROLLBACK_IMAGE_AVAILABLE == '1' }}
        run: |
          # Recria a tag manual a partir da referência protegida por run. Assim,
          # mesmo que um prune remova qlmed-app:previous durante o deploy, ainda
          # preservamos a imagem anterior antes de descartar a referência segura.
          rollback_image="qlmed-app:rollback-${GITHUB_RUN_ID}"
          docker image inspect "$rollback_image" >/dev/null
          docker tag "$rollback_image" qlmed-app:previous
          docker image inspect qlmed-app:previous >/dev/null \
            || { echo "::error::qlmed-app:previous ausente após deploy — rollback manual quebrado"; exit 1; }
          echo "qlmed-app:previous OK"

      - name: Verify first-deploy rollback state
        if: ${{ success() && env.ROLLBACK_IMAGE_AVAILABLE != '1' }}
        run: |
          echo "Primeiro deploy sem container prévio — nada a verificar"

      - name: Clean run-scoped rollback tag
        if: ${{ success() && env.ROLLBACK_IMAGE_AVAILABLE == '1' }}
        run: |
          # Só remove a referência segura depois de confirmar a tag manual. Se a
          # verificação falhar, o passo de rollback ainda encontra esta imagem.
          docker rmi "qlmed-app:rollback-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

      - name: Roll back failed deployment
        if: ${{ failure() && env.ROLLBACK_IMAGE_AVAILABLE == '1' && steps.app_verified.outcome != 'success' }}
        run: |
          # Este rollback reverte apenas a imagem do qlmed-app; não desfaz migração
          # de banco que já tenha sido aplicada. A imagem anterior deve permanecer
          # compatível com o schema expandido conforme docs/architecture/data.md.
          QLMED_BUILD_COMMIT_SHA="rollback-${GITHUB_RUN_ID}" docker compose \
            --project-name qlmed \
            --env-file /home/marce/qlmed/production/.env \
            -f /home/marce/qlmed/production/docker-compose.yml \
            up -d --no-build --force-recreate qlmed-app
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:13000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Rollback health check failed" >&2
          exit 1
