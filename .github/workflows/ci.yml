name: QLMED CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qlmed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Binding selector: validation-linux-qlmed + self-hosted (3 GB per runner,
# same labels as validation-linux-pool). Same-repo guard is
# defense in depth; fork approval is all_external_contributors.

jobs:
  changes:
    name: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - pb-linux
      - pb-x64
      - pb-docs
      - pb-python
      - pb-shell
      - pb-powershell
      - pb-dotnet
      - pb-node
      - pb-validation
      - pb-build
      - pb-persistent
    timeout-minutes: 5
    outputs:
      # Push to main always runs the full app job (CI verification on main).
      # Production deploy is manual (workflow_dispatch); CI success alone never deploys.
      app: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.app }}
    steps:
      - name: Refuse production runner
        run: |
          set -euo pipefail
          if ! printf '%s' "${RUNNER_NAME}" | grep -Eq '^qlmed-ci-linux-[0-9]{2}$'; then
            echo "CI must run on qlmed-ci-linux-NN, got ${RUNNER_NAME:-empty}" >&2
            exit 1
          fi

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect app-relevant paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'src/**'
              - 'prisma/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - '.eslintrc*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - 'vitest*.{ts,mjs,js}'
              - 'Dockerfile*'
              - 'start.sh'
              - '.ci-loop/**'
              - 'n8n/**'
              # Superfície operacional. O filtro nasceu pensando em src/prisma e
              # deixava passar sem CI toda mudança de compose, systemd, script de
              # host e política de dependências — exatamente o material que
              # derruba produção. Auditoria b177b07, QLMED-OPS-001.
              - 'ops/**'
              - 'production/**'
              - 'docker-compose.yml'
              - '.github/dependabot.yml'
              # Glob, não a lista de dois ficheiros: um workflow novo (ou o
              # ai-tooling-drift.yml, que já existia) escapava do job app.
              - '.github/workflows/**'

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.app != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      - self-hosted
      - pb-linux
      - pb-x64
      - pb-docs
      - pb-python
      - pb-shell
      - pb-powershell
      - pb-dotnet
      - pb-node
      - pb-validation
      - pb-build
      - pb-persistent
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove production is unreachable
        run: python3 ./scripts/verify-ci-isolation.py

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate specifications and architecture documentation
        run: |
          npm run docs:validate:test
          npm run docs:validate
          npm run ai-tooling:check:test
          npm run ai-tooling:check

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      - self-hosted
      - pb-linux
      - pb-x64
      - pb-docs
      - pb-python
      - pb-shell
      - pb-powershell
      - pb-dotnet
      - pb-node
      - pb-validation
      - pb-build
      - pb-persistent
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://qlmed_ci:qlmed_ci@qlmed-ci-db:5432/qlmed_ci?schema=public
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove production is unreachable
        run: python3 ./scripts/verify-ci-isolation.py

      - name: Verify CI hardening policy
        run: |
          bash ./scripts/verify-ci-hardening.sh
          bash ./scripts/test-ci-hardening.sh
          bash ./scripts/test-deploy-guard.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.*', 'tsconfig*.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma client
        run: |
          npm run db:config:verify
          npx prisma generate
          npx prisma validate

      - name: Validate specifications and architecture documentation
        run: |
          npm run docs:validate:test
          npm run docs:validate
          npm run ai-tooling:check:test
          npm run ai-tooling:check

      - name: Reset disposable CI schema
        run: node ./scripts/reset-ci-database.mjs

      - name: Replay and verify migration history
        run: bash ./scripts/verify-migrations.sh

      - name: Verify legacy reconciliation is repairable and idempotent
        run: npm run db:reconcile:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: UI · regras e controles
        run: npm run ui:check

      - name: Test
        run: npm test

      - name: Test transactional outbox
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: UI · galeria contra o CSS do build
        run: |
          npm run ui:gallery:check
          npm run ui:gallery:test

      - name: Dependency audit
        run: |
          npm run audit:verify:test
          npm run audit:verify

  # Required check name for branch protection on main.
  quality:
    name: quality
    needs: [changes, docs, app]
    if: always() && needs.changes.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      - self-hosted
      - pb-linux
      - pb-x64
      - pb-docs
      - pb-python
      - pb-shell
      - pb-powershell
      - pb-dotnet
      - pb-node
      - pb-validation
      - pb-build
      - pb-persistent
    timeout-minutes: 5
    steps:
      - name: Gate required status check
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.outputs.app }}" == "true" ]]; then
            test "${{ needs.app.result }}" = "success"
          else
            test "${{ needs.docs.result }}" = "success"
          fi
