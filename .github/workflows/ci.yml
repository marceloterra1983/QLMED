name: QLMED CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qlmed_ci
          POSTGRES_DB: qlmed_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qlmed_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:qlmed_ci@127.0.0.1:5432/qlmed_ci?schema=public
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma client
        run: |
          npx prisma generate
          npx prisma validate

      - name: Validate specifications and architecture documentation
        run: |
          npm run docs:validate:test
          npm run docs:validate

      - name: Replay and verify migration history
        run: bash ./scripts/verify-migrations.sh

      - name: Verify legacy reconciliation is repairable and idempotent
        run: npm run db:reconcile:verify

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test transactional outbox
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
