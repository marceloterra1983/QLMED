name: QLMED CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qlmed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    # Self-hosted: GitHub-hosted minutes blocked by account billing/spending limit
    # after recovery (2026-07-30). Keep label aligned with production runner.
    runs-on:
      - self-hosted
      - qlmed-prod
    timeout-minutes: 5
    outputs:
      # Push to main always runs the full app job (CI verification on main).
      # Production deploy is manual (workflow_dispatch); CI success alone never deploys.
      app: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.app }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect app-relevant paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            app:
              - 'src/**'
              - 'prisma/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - '.eslintrc*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - 'vitest*.{ts,mjs,js}'
              - 'Dockerfile*'
              - 'start.sh'
              - '.ci-loop/**'
              - 'n8n/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-production.yml'

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.app != 'true'
    runs-on:
      - self-hosted
      - qlmed-prod
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate specifications and architecture documentation
        run: |
          npm run docs:validate:test
          npm run docs:validate

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on:
      - self-hosted
      - qlmed-prod
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qlmed_ci
          POSTGRES_DB: qlmed_ci
        # 5433 avoids colliding with production qlmed-db on the same host.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qlmed_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:qlmed_ci@127.0.0.1:5433/qlmed_ci?schema=public
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.*', 'tsconfig*.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma client
        run: |
          npm run db:config:verify
          npx prisma generate
          npx prisma validate

      - name: Validate specifications and architecture documentation
        run: |
          npm run docs:validate:test
          npm run docs:validate

      - name: Replay and verify migration history
        run: bash ./scripts/verify-migrations.sh

      - name: Verify legacy reconciliation is repairable and idempotent
        run: npm run db:reconcile:verify

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test transactional outbox
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  # Required check name for branch protection on main.
  quality:
    name: quality
    needs: [changes, docs, app]
    if: always() && needs.changes.result == 'success'
    runs-on:
      - self-hosted
      - qlmed-prod
    timeout-minutes: 5
    steps:
      - name: Gate required status check
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.outputs.app }}" == "true" ]]; then
            test "${{ needs.app.result }}" = "success"
          else
            test "${{ needs.docs.result }}" = "success"
          fi
