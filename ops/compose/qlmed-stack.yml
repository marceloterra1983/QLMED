# ATENÇÃO — este ficheiro NÃO é o compose canônico.
#
# O canônico é `production/docker-compose.yml`: é ele que o
# `.github/workflows/deploy-production.yml` usa (`-f
# /home/marce/qlmed/production/docker-compose.yml`) e é ele que
# `scripts/deploy-server.sh` sincroniza. Esta cópia em `ops/` é histórica,
# mantida só como referência de operação do host.
#
# Auditoria b177b07 (QLMED-OPS-003): as duas divergiam, e a divergência não era
# cosmética — esta cópia passava `QLMED_API_KEY` como `build.args`, o que grava
# o segredo numa camada da imagem e no histórico do `docker history`. Um
# build-arg não é um segredo. A chave chega ao runtime por `env_file`
# (`./env/app.env`), como no compose canônico.
#
# Regra: mudança de topologia entra no canônico primeiro; esta cópia acompanha
# ou é apagada. Nunca o contrário.
services:
  qlmed-db:
    image: postgres:18-alpine
    container_name: qlmed-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  qlmed-app:
    image: qlmed-app:${QLMED_BUILD_COMMIT_SHA:-local}
    build:
      context: ./app
      network: host
      args:
        # QLMED_API_KEY saiu daqui: build-arg vira camada de imagem e aparece
        # em `docker history`. A chave entra por env_file, no runtime.
        QLMED_BUILD_COMMIT_SHA: ${QLMED_BUILD_COMMIT_SHA:-unknown}
        QLMED_BUILD_DEPLOYED_AT: ${QLMED_BUILD_DEPLOYED_AT:-}
        QLMED_BUILD_SOURCE: ${QLMED_BUILD_SOURCE:-manual}
    container_name: qlmed-app
    restart: unless-stopped
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:13000:3000"
    env_file:
      - ./env/app.env
      - ./.deploy-meta.env
    volumes:
      - app_storage:/app/storage
    depends_on:
      qlmed-db:
        condition: service_healthy

volumes:
  pgdata:
    name: qlmed_pgdata
  app_storage:
    name: qlmed_app_storage
networks:
  default:
    name: qlmed_network
