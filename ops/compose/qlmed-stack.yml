# ATENÇÃO — este ficheiro NÃO é o compose canônico.
#
# O canônico é `production/docker-compose.yml`: é ele que o
# `.github/workflows/deploy-production.yml` usa (`-f
# /home/marce/qlmed/production/docker-compose.yml`) e é ele que
# `scripts/deploy-server.sh` sincroniza. Esta cópia em `ops/` é histórica,
# mantida só como referência de operação do host.
#
# Auditoria b177b07 (QLMED-OPS-003): as duas divergiam, e a divergência não era
# cosmética — esta cópia passava `QLMED_API_KEY` como `build.args`, o que grava
# o segredo numa camada da imagem e no histórico do `docker history`. Um
# build-arg não é um segredo. A chave chega ao runtime por `env_file`
# (`./env/app.env`), como no compose canônico.
#
# Regra: mudança de topologia entra no canônico primeiro; esta cópia acompanha
# ou é apagada. Nunca o contrário.
services:
  qlmed-db:
    image: postgres:18-alpine
    container_name: qlmed-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  qlmed-n8n:
    image: n8nio/n8n:2.29.10@sha256:9cb60554716a0ab11a966e79ed65171e1bbf00b6d262ba12aa119bba22eb6000
    container_name: qlmed-n8n
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5678:5678"
      - "100.83.11.58:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./env/n8n-legacy.env
      - ./env/n8n.env
      - ./env/n8n-automation.env
    volumes:
      - n8n_data:/home/node/.n8n
    # Rede explícita: após queda de link/reboot o endpoint Docker às vezes
    # some (Networks={}); o watchdog reconecta, mas o alias canônico ajuda.
    networks:
      default:
        aliases: [qlmed-n8n]
    depends_on:
      n8n-db:
        condition: service_healthy
      qlmed-app:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  n8n-db:
    image: postgres:18-alpine
    container_name: qlmed-n8n-db
    restart: unless-stopped
    env_file:
      - ./env/n8n-db.env
    volumes:
      - n8n_pgdata:/var/lib/postgresql
    networks:
      default:
        # n8n-db: legado nos env; qlmed-n8n-db: container_name (mais estável)
        aliases: [n8n-db, qlmed-n8n-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 30

  qlmed-app:
    image: qlmed-app:${QLMED_BUILD_COMMIT_SHA:-local}
    build:
      context: ./app
      network: host
      args:
        # QLMED_API_KEY saiu daqui: build-arg vira camada de imagem e aparece
        # em `docker history`. A chave entra por env_file, no runtime.
        QLMED_BUILD_COMMIT_SHA: ${QLMED_BUILD_COMMIT_SHA:-unknown}
        QLMED_BUILD_DEPLOYED_AT: ${QLMED_BUILD_DEPLOYED_AT:-}
        QLMED_BUILD_SOURCE: ${QLMED_BUILD_SOURCE:-manual}
    container_name: qlmed-app
    restart: unless-stopped
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:13000:3000"
    env_file:
      - ./env/app.env
      - ./.deploy-meta.env
    volumes:
      - app_storage:/app/storage
    depends_on:
      qlmed-db:
        condition: service_healthy

volumes:
  pgdata:
    name: qlmed_pgdata
  n8n_data:
    external: true
    name: qlmed_n8n_data
  app_storage:
    name: qlmed_app_storage
  n8n_pgdata:
    name: qlmed_n8n_pgdata

networks:
  default:
    name: qlmed_network
