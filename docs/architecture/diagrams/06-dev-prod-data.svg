<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1061" height="506" viewBox="0 0 1061 506" role="img" aria-labelledby="title desc">
  <title id="title">Banco canônico QLMED e recuperação</title>
  <desc id="desc">O app local e o app de produção usam DATABASE_URL para o mesmo PostgreSQL canônico; o conjunto qlmed do server-backup fornece recuperação.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#6c8ebf"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12px; }
      .box { stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #6c8ebf; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1061" height="506" fill="#ffffff"/>
  <text class="title" x="40" y="40">Banco canônico QLMED e recuperação</text>

  <rect class="box" x="40" y="105" width="180" height="84" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="130" y="136" text-anchor="middle">Host server</text>
  <text class="small" x="130" y="159" text-anchor="middle">checkout / execução local</text>

  <rect class="box" x="40" y="250" width="180" height="84" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="label" x="130" y="281" text-anchor="middle">app-dev</text>
  <text class="small" x="130" y="304" text-anchor="middle">npm run dev ou Docker</text>

  <rect class="box" x="40" y="395" width="180" height="72" fill="#d5e8d4" stroke="#82b366"/>
  <text class="label" x="130" y="425" text-anchor="middle">qlmed-app</text>
  <text class="small" x="130" y="447" text-anchor="middle">produção :13000</text>

  <rect class="box" x="300" y="230" width="200" height="108" fill="#ffe6cc" stroke="#d79b00"/>
  <text class="label" x="400" y="263" text-anchor="middle">DATABASE_URL</text>
  <text class="small" x="400" y="286" text-anchor="middle">variável protegida</text>
  <text class="small" x="400" y="308" text-anchor="middle">sem aliases *_DEV/*_PROD</text>

  <rect class="box" x="580" y="210" width="210" height="148" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="label" x="685" y="245" text-anchor="middle">PostgreSQL canônico</text>
  <text class="small" x="685" y="270" text-anchor="middle">qlmed-db · database postgres</text>
  <text class="small" x="685" y="294" text-anchor="middle">um único estado persistente</text>
  <text class="small" x="685" y="318" text-anchor="middle">runtime + migrations versionadas</text>

  <rect class="box" x="850" y="210" width="170" height="148" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="935" y="245" text-anchor="middle">server-backup</text>
  <text class="small" x="935" y="270" text-anchor="middle">conjunto qlmed</text>
  <text class="small" x="935" y="294" text-anchor="middle">pg_dump + remoto</text>
  <text class="small" x="935" y="318" text-anchor="middle">receipt / restore / drill</text>

  <path class="flow" d="M220 292 H300"/>
  <path class="flow" d="M220 431 C260 431 260 320 300 320"/>
  <path class="flow" d="M500 284 H580"/>
  <path class="flow" d="M790 284 H850"/>

  <rect class="box" x="300" y="395" width="490" height="72" fill="#f8cecc" stroke="#b85450"/>
  <text class="small" x="545" y="423" text-anchor="middle">Um único banco persistente; não criar qlmed_dev.</text>
  <text class="small" x="545" y="446" text-anchor="middle">CI usa qlmed_ci somente de forma efêmera.</text>
</svg>
