<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1061" height="396" viewBox="0 0 1061 396" role="img" aria-labelledby="title desc">
  <title id="title">Deploy produção QLMED</title>
  <desc id="desc">Pipeline de CI e deploy com um único banco persistente configurado por DATABASE_URL e CI efêmero.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#6c8ebf"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12px; }
      .box { stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #6c8ebf; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1061" height="396" fill="#ffffff"/>
  <text class="title" x="40" y="38">Deploy produção QLMED (GitHub Actions)</text>

  <rect class="box" x="40" y="82" width="150" height="72" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="label" x="115" y="111" text-anchor="middle">app-dev</text>
  <text class="small" x="115" y="133" text-anchor="middle">push main</text>

  <rect class="box" x="235" y="82" width="160" height="72" fill="#d5e8d4" stroke="#82b366"/>
  <text class="label" x="315" y="111" text-anchor="middle">QLMED CI</text>
  <text class="small" x="315" y="133" text-anchor="middle">build · test · qlmed_ci</text>

  <rect class="box" x="440" y="82" width="180" height="72" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="530" y="111" text-anchor="middle">Aprovação manual</text>
  <text class="small" x="530" y="133" text-anchor="middle">DEPLOY + SHA completo</text>

  <rect class="box" x="665" y="82" width="160" height="72" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="label" x="745" y="111" text-anchor="middle">Runner qlmed-prod</text>
  <text class="small" x="745" y="133" text-anchor="middle">sync · compose</text>

  <rect class="box" x="870" y="82" width="150" height="72" fill="#d5e8d4" stroke="#82b366"/>
  <text class="label" x="945" y="111" text-anchor="middle">Health</text>
  <text class="small" x="945" y="133" text-anchor="middle">local + público TLS</text>

  <path class="flow" d="M190 118 H235"/>
  <path class="flow" d="M395 118 H440"/>
  <path class="flow" d="M620 118 H665"/>
  <path class="flow" d="M825 118 H870"/>

  <rect class="box" x="40" y="220" width="390" height="105" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="58" y="249">Contrato de persistência</text>
  <text class="small" x="58" y="272">Um único banco persistente via DATABASE_URL.</text>
  <text class="small" x="58" y="293">CI usa qlmed_ci somente de forma efêmera.</text>
  <text class="small" x="58" y="314">O conjunto de backup qlmed protege o banco canônico.</text>

  <rect class="box" x="480" y="220" width="300" height="105" fill="#f8cecc" stroke="#b85450"/>
  <text class="label" x="498" y="249">Falha de health</text>
  <text class="small" x="498" y="272">rollback para qlmed-app:rollback-&lt;run_id&gt;</text>
  <text class="small" x="498" y="293">rollback de imagem não reverte schema.</text>
  <text class="small" x="498" y="314">Registrar receipt e canários.</text>

  <rect class="box" x="830" y="220" width="190" height="105" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="label" x="925" y="249" text-anchor="middle">Gate</text>
  <text class="small" x="925" y="272" text-anchor="middle">backup receipt recente</text>
  <text class="small" x="925" y="293" text-anchor="middle">antes de manutenção</text>
  <text class="small" x="925" y="314" text-anchor="middle">que altere dados</text>
</svg>
