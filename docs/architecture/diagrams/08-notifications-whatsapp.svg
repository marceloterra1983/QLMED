<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="#ffffff"/>

  <text x="40" y="38" font-size="17" font-weight="bold" fill="#1a1a1a">Notificações WhatsApp — outbox + Evolution</text>

  <!-- row 1 -->
  <g>
    <rect x="60" y="140" width="150" height="70" rx="10" fill="#d5e8d4" stroke="#82b366"/>
    <text x="135" y="170" font-size="11" text-anchor="middle" fill="#1a1a1a">qlmed-app</text>
    <text x="135" y="186" font-size="11" text-anchor="middle" fill="#1a1a1a">evento de domínio</text>
  </g>

  <g>
    <rect x="280" y="140" width="200" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="380" y="168" font-size="11" text-anchor="middle" fill="#1a1a1a">NotificationOutboxEvent</text>
    <text x="380" y="184" font-size="11" text-anchor="middle" fill="#1a1a1a">+ NotificationDelivery</text>
    <text x="380" y="200" font-size="11" text-anchor="middle" fill="#1a1a1a">(PostgreSQL)</text>
  </g>

  <g>
    <rect x="540" y="140" width="200" height="90" rx="10" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="640" y="168" font-size="11" text-anchor="middle" fill="#1a1a1a">worker.py host</text>
    <text x="640" y="184" font-size="11" text-anchor="middle" fill="#1a1a1a">cron a cada 10 min UTC</text>
    <text x="640" y="200" font-size="11" text-anchor="middle" fill="#1a1a1a">claim/ack outbox API</text>
  </g>

  <g>
    <rect x="800" y="140" width="150" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="875" y="168" font-size="11" text-anchor="middle" fill="#1a1a1a">Evolution API</text>
    <text x="875" y="184" font-size="11" text-anchor="middle" fill="#1a1a1a">:8085</text>
    <text x="875" y="200" font-size="11" text-anchor="middle" fill="#1a1a1a">WhatsApp</text>
  </g>

  <g>
    <rect x="1000" y="140" width="130" height="70" rx="10" fill="#fff2cc" stroke="#d6b656"/>
    <text x="1065" y="170" font-size="11" text-anchor="middle" fill="#1a1a1a">WhatsApp</text>
    <text x="1065" y="186" font-size="11" text-anchor="middle" fill="#1a1a1a">usuário/operador</text>
  </g>

  <!-- row 1 arrows -->
  <path d="M210,175 L280,175" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M480,180 L540,180" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M740,180 L800,175" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M950,175 L1000,175" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <g>
    <rect x="540" y="280" width="200" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="640" y="308" font-size="11" text-anchor="middle" fill="#1a1a1a">n8n QLMED</text>
    <text x="640" y="324" font-size="11" text-anchor="middle" fill="#1a1a1a">workflows + error handler</text>
    <text x="640" y="340" font-size="11" text-anchor="middle" fill="#1a1a1a">(alerta-erros)</text>
  </g>

  <!-- n8n -> Evolution API -->
  <path d="M740,310 L800,240 L800,210" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- note -->
  <g>
    <path d="M60,280 L340,280 L360,300 L360,380 L60,380 Z" fill="#fff2cc" stroke="#d6b656"/>
    <path d="M340,280 L340,300 L360,300 Z" fill="none" stroke="#d6b656"/>
    <text x="70" y="298" font-size="10" fill="#1a1a1a">Canal oficial WA QLMED: Evolution da stack QLMED</text>
    <text x="70" y="312" font-size="10" fill="#1a1a1a">(não shared-evolution Charlie).</text>
    <text x="70" y="326" font-size="10" fill="#1a1a1a">Spec: integrations/whatsapp + evolution-api.</text>
  </g>
</svg>
