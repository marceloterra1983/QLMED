# Este compose gerencia SOMENTE qlmed-app e qlmed-n8n.
# qlmed-db e evolution (api/db/redis) são Coolify-managed — definição de
# referência em ./docker-compose.coolify.yml. Não redeclarar aqui: um
# `up -d` criaria stack vazia paralela e colidiria na porta 8085
# (auditoria 2026-07-21).
services:
  qlmed-app:
    image: qlmed-app:${QLMED_BUILD_COMMIT_SHA:-local}
    build:
      context: ./app
      args:
        QLMED_API_KEY: ${QLMED_API_KEY}
        QLMED_BUILD_COMMIT_SHA: ${QLMED_BUILD_COMMIT_SHA:-unknown}
        QLMED_BUILD_DEPLOYED_AT: ${QLMED_BUILD_DEPLOYED_AT:-}
        QLMED_BUILD_SOURCE: ${QLMED_BUILD_SOURCE:-production}
    container_name: qlmed-app
    restart: unless-stopped
    ports:
      - "13000:3000"
    env_file:
      - ./env/app.env
    volumes:
      - app_storage:/app/storage
    networks:
      - default
      - coolify_net

  qlmed-n8n:
    image: n8nio/n8n:2.23.4@sha256:1872cce3548bf4dcfe5aceaf3d9293f4499635823fbdea0ee726bd222d2e44b8
    container_name: qlmed-n8n
    restart: unless-stopped
    # host.docker.internal → host-gateway permite ao n8n alcançar o listener
    # de enqueue do Autofix no host (127.0.0.1:18642). Perdido ao recriar via
    # compose em 2026-07-14; restaurado 2026-07-16 (shared-n8n já o tinha).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5678:5678"
      - "100.83.11.58:5678:5678"
    env_file:
      - ./env/n8n.env
    volumes:
      # External volume owned by Coolify — holds workflows + credentials + encryption key.
      - n8n_data:/home/node/.n8n
    networks:
      # Share coolify_net so `qlmed-app:3000` resolves for HTTP nodes.
      - default
      - coolify_net
    depends_on:
      - qlmed-app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  n8n_data:
    # External volume owned by Coolify — must NOT be recreated by compose.
    # Contains n8n workflows, credentials, and encryption key.
    external: true
    name: lkwc0s0ck8kcckocc4goc0kg_n8n-data
  app_storage:
    name: qlmed_app_storage

networks:
  default:
    name: qlmed_network
  coolify_net:
    external: true
    name: lkwc0s0ck8kcckocc4goc0kg
