services:
  qlmed-db:
    image: postgres:18-alpine
    container_name: qlmed-db
    restart: unless-stopped
    # REAUD-B-12: mesmo endurecimento que qlmed-app e qlmed-n8n já tinham. O
    # conjunto de capabilities foi medido em container descartável (initdb em
    # volume novo, recriação sobre dados existentes e `docker restart`): o
    # entrypoint corre como root, faz chown/chmod no PGDATA e desce para
    # `postgres` com su-exec. O servidor em si corre com CapEff=0.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  qlmed-n8n:
    image: n8nio/n8n:2.29.10@sha256:9cb60554716a0ab11a966e79ed65171e1bbf00b6d262ba12aa119bba22eb6000
    container_name: qlmed-n8n
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5678:5678"
      - "100.83.11.58:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./env/n8n-legacy.env
      - ./env/n8n.env
      - ./env/n8n-restored.env
      - ./env/n8n-automation.env
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      default:
    depends_on:
      qlmed-app:
        condition: service_started
      n8n-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  n8n-db:
    image: postgres:18-alpine
    container_name: qlmed-n8n-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    env_file:
      - ./env/n8n-db.env
    volumes:
      - n8n_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 30

  qlmed-app:
    image: qlmed-app:${QLMED_BUILD_COMMIT_SHA:-local}
    build:
      context: ./app
      network: host
      args:
        QLMED_BUILD_COMMIT_SHA: ${QLMED_BUILD_COMMIT_SHA:-unknown}
        QLMED_BUILD_DEPLOYED_AT: ${QLMED_BUILD_DEPLOYED_AT:-}
        QLMED_BUILD_SOURCE: ${QLMED_BUILD_SOURCE:-manual}
    container_name: qlmed-app
    restart: unless-stopped
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:13000:3000"
    env_file:
      - ./env/app.env
      - ./.deploy-meta.env
    volumes:
      - app_storage:/app/storage
    depends_on:
      qlmed-db:
        condition: service_healthy

volumes:
  pgdata:
    name: qlmed_pgdata
  n8n_data:
    external: true
    name: qlmed_n8n_data
  app_storage:
    name: qlmed_app_storage
  n8n_pgdata:
    name: qlmed_n8n_pgdata

networks:
  default:
    name: qlmed_network
